[package]
name = "grok-codex-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native local protocol bridge between Codex and Grok"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
eventsource-stream = "0.2.3"
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lib]
name = "grok_codex_bridge"
path = "src/lib.rs"

[[bin]]
name = "grok-codex-bridge"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
